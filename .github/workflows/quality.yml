name: SQL quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic quality report
        run: python src/run_checks.py --reports-dir reports
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: sql-quality-report
          path: reports/
          if-no-files-found: error
